name: GitHub Release

# Package publication owns artifact verification. This workflow reacts only after that
# release succeeds on the configured release branch, then creates an immutable tag and
# an idempotent GitHub Release for the exact released commit.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Exact release commit SHA (blank uses the selected ref)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.target || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install trusted release tooling
        run: |
          set -euo pipefail
          # Where this repository keeps its own copy of the tooling, from
          # `[install] self_source` in .vibey-gh.toml -- a DECLARED path, never a search.
          # Searching the tree for a pyproject declaring `name = "vibey-gh"` would read a
          # pull request's own files: a branch that adds one anywhere gets it installed
          # here, with this job's permissions, and hands the provenance gate a tool of the
          # contributor's choosing. The path is verified below before anything runs.
          self="src/vibey_tools/gh"
          # Verified, not assumed: a misconfigured path must fall back to the published
          # release rather than install whatever happens to sit there.
          grep -qE '^name = "vibey-gh"' "$self/pyproject.toml" 2>/dev/null || self=""
          if [ -n "$self" ]; then
            python -m pip install --quiet -e "$self"
          else
            python -m pip install --quiet "vibey-gh==1.73.0"
          fi
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target || github.event.workflow_run.head_sha || github.sha }}
        run: vibey-gh github-release --target "$TARGET"
