name: Branch sync

# Generated by vibey-gh. Two jobs that keep open work from silently rotting:
# `sync` brings every open branch forward whenever the integration branch moves, so a
# conflict never accumulates in the first place; `heal` gives a pull request whose repair
# budget is spent one more bounded round, so a transient outage does not become a
# permanent stop that only a human can notice.
on:
  push:
    branches: [develop]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide without rebasing, updating, closing, or deleting"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: branch-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Bring open branches forward
    if: true && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install vibey-gh
        run: |
          set -euo pipefail
          # The pyproject that DECLARES the tooling, wherever it sits: the top of the tree
          # in the standalone repository, under src/ in the monorepo that absorbed it. A
          # repository that carries it must install that source, never a published release
          # that is always behind its own integration branch.
          self=""
          for candidate in $(git ls-files --full-name '*pyproject.toml'); do
            grep -qE '^name = "vibey-gh"' "$candidate" || continue
            self=${candidate%/pyproject.toml}
            if [ "$self" = "$candidate" ]; then self=.; fi
            break
          done
          if [ -n "$self" ]; then
            python -m pip install --quiet -e "$self"
          else
            python -m pip install --quiet vibey-gh
          fi
          command -v vibey-gh >/dev/null || { echo "::error::vibey-gh is not installed"; exit 1; }
      - name: Reconcile every open branch
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name 'vibey[bot]'
          git config user.email 'adam@matthewsteinberger.com'
          gh auth setup-git
          if [ "${{ inputs.dry_run }}" = true ]; then
            vibey-gh reconcile-branches --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          else
            vibey-gh reconcile-branches | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  heal:
    name: Refill spent repair budgets
    if: true && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install vibey-gh
        run: |
          set -euo pipefail
          # The pyproject that DECLARES the tooling, wherever it sits: the top of the tree
          # in the standalone repository, under src/ in the monorepo that absorbed it. A
          # repository that carries it must install that source, never a published release
          # that is always behind its own integration branch.
          self=""
          for candidate in $(git ls-files --full-name '*pyproject.toml'); do
            grep -qE '^name = "vibey-gh"' "$candidate" || continue
            self=${candidate%/pyproject.toml}
            if [ "$self" = "$candidate" ]; then self=.; fi
            break
          done
          if [ -n "$self" ]; then
            python -m pip install --quiet -e "$self"
          else
            python -m pip install --quiet vibey-gh
          fi
          command -v vibey-gh >/dev/null || { echo "::error::vibey-gh is not installed"; exit 1; }
      - name: Refill and re-dispatch
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Each refill is itself budgeted by branch_sync.max_self_heals, so a pull request
          # that keeps failing for the same reason stops for good rather than looping daily.
          result=$(vibey-gh pr-automation self-heal)
          printf '%s\n' "$result" | jq .
          printf "### Repair budgets refilled\n\n\`\`\`json\n%s\n\`\`\`\n" \
            "$(jq . <<<"$result")" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | select(.healed == true) | "\(.pr)\t\(.head_sha)"' <<<"$result" |
          while IFS=$'\t' read -r number sha; do
            [ -n "$number" ] || continue
            gh workflow run pr-automation.yml --repo "$REPO" \
              --ref "${{ github.event.repository.default_branch }}" \
              -f "pr=${number}" -f "head_sha=${sha}"
          done
