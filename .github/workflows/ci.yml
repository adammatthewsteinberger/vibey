name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vibey
          POSTGRES_PASSWORD: vibey
          POSTGRES_DB: vibey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VIBEY_TEST_DATABASE_URL: postgresql://vibey:vibey@localhost:5432/vibey_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Gate 1 - ruff check
        run: uv run ruff check .

      - name: Gate 2 - ruff format --check
        run: uv run ruff format --check .

      - name: Gate 3 - mypy --strict
        run: uv run mypy --strict src/vibey

      - name: Gate 4 - pytest (domain coverage floor 100%)
        run: uv run pytest tests/domain --cov=vibey.domain --cov-report=term-missing --cov-fail-under=100

      - name: Gate 4b - pytest (full suite, project coverage floor 90%)
        run: uv run pytest --cov=vibey --cov-report=term-missing --cov-fail-under=90

      - name: Gate 5 - lint-imports (onion contract)
        run: uv run lint-imports

      - name: Gate 6 - bandit
        run: uv run bandit -q -r src/vibey

      - name: Gate 7 - pip-audit
        run: uv run pip-audit
