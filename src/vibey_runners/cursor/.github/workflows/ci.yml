name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy src/cursorloop

  imports:
    name: import-linter (onion contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: lint-imports

  security:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: bandit -q -r src/cursorloop
      - run: pip-audit

  uv-lock:
    name: uv.lock is in sync with pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.6"
          enable-cache: true
      - run: uv lock --check

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # One instrumented run feeds all four floors. `coverage report
      # --include=` filters the written data file per layer, so each floor
      # keeps an independent verdict without re-running the suite. The full
      # suite IS this run: 5 executions -> 1, ~15s -> ~5s.
      - name: Full suite
        run: pytest tests --cov=cursorloop --cov-branch --cov-report=
      - name: Domain coverage floor (100%)
        run: coverage report --include='src/cursorloop/domain/*' --fail-under=100
      - name: Application coverage floor (100%)
        run: coverage report --include='src/cursorloop/application/*' --fail-under=100
      - name: Infrastructure coverage floor (100%)
        run: coverage report --include='src/cursorloop/infrastructure/*' --fail-under=100
      - name: CLI coverage floor (100%)
        run: coverage report --include='src/cursorloop/cli/*' --fail-under=100
