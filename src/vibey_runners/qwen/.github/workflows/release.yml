name: Release

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
      - name: Stamp development version
        if: github.ref == 'refs/heads/develop'
        run: |
          uvx vibey-gh version --dev "${GITHUB_RUN_NUMBER}" --apply
      - id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print("version=" + data["project"]["version"])
          PY
      - run: uv build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with: {name: dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI artifact
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
      - name: Install exact TestPyPI version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The qwenloop dev artifact lives on TestPyPI, while its normal
          # dependencies live on PyPI. uv's safe first-index policy would pin
          # every package name found on TestPyPI to that incomplete index.
          for attempt in $(seq 1 20); do
            if uv tool install --refresh \
              --index https://test.pypi.org/simple/ \
              --index https://pypi.org/simple/ \
              --index-strategy unsafe-best-match \
              "qwenloop==${VERSION}"; then
              break
            fi
            sleep 30
          done
          qwenloop --version
          qwenloop --help

  pypi:
    name: Publish to PyPI
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with: {name: dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  verify-pypi:
    name: Verify PyPI artifact
    needs: [build, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
      - name: Install exact PyPI version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            if uv tool install --refresh \
              --index https://pypi.org/simple/ \
              "qwenloop==${VERSION}"; then
              break
            fi
            sleep 30
          done
          qwenloop --version
          qwenloop --help
