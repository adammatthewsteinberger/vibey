source = { editable = "." }
dependencies = [
    { name = "asyncpg" },
    { name = "structlog" },
    { name = "textual" },
    { name = "tomli-w" },
    { name = "typer" },
]

[package.optional-dependencies]
dev = [
    { name = "bandit" },
    { name = "hypothesis" },
    { name = "import-linter" },
    { name = "mypy" },
    { name = "pip-audit" },
    { name = "pre-commit" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "asyncpg", specifier = ">=0.30" },
    { name = "bandit", marker = "extra == 'dev'", specifier = ">=1.8" },
    { name = "hypothesis", marker = "extra == 'dev'", specifier = ">=6.115" },
    { name = "import-linter", marker = "extra == 'dev'", specifier = ">=2.1" },
    { name = "mypy", marker = "extra == 'dev'", specifier = ">=1.13" },
    { name = "pip-audit", marker = "extra == 'dev'", specifier = ">=2.7" },
    { name = "pre-commit", marker = "extra == 'dev'", specifier = ">=4.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.3" },
    { name = "pytest-asyncio", marker = "extra == 'dev'", specifier = ">=0.24" },
    { name = "pytest-cov", marker = "extra == 'dev'", specifier = ">=6.0" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.8" },
    { name = "structlog", specifier = ">=24.4" },
    { name = "textual", specifier = ">=0.86" },
    { name = "tomli-w", specifier = ">=1.1" },
    { name = "typer", specifier = ">=0.15" },
]
provides-extras = ["dev"]

