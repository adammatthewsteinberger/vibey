[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibey"
version = "0.1.0"
description = "A queue-based, six-phase conductor with optional visual design and Azure deployment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.15",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "textual>=0.86",
    "tomli-w>=1.1",
]

[project.scripts]
vibey = "vibey.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vibey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running Postgres reachable via VIBEY_TEST_DATABASE_URL",
    "slow: takes more than a couple seconds to run",
    "system: delivery-stage-set end-to-end system test",
]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vibey"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/vibey"]

[tool.coverage.report]
fail_under = 90
